name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_TOOLCHAIN: stable
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Enable sccache if available
        shell: bash
        run: |
          if SCCACHE_GHA_ENABLED=true sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache unavailable; continuing without RUSTC_WRAPPER"
          fi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.os }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-registry-

      - name: Install LLVM (Windows only)
        if: matrix.os == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
          cached: true

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p warp-opencode -- -D warnings
        env:
          LIBCLANG_PATH: ${{ matrix.os == 'windows-latest' && format('{0}\bin', env.LLVM_PATH) || '' }}

      - name: test
        run: cargo test -p warp-opencode --all
        env:
          LIBCLANG_PATH: ${{ matrix.os == 'windows-latest' && format('{0}\bin', env.LLVM_PATH) || '' }}
