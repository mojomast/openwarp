name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: stable
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build · Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Enable sccache if available
        shell: bash
        run: |
          if SCCACHE_GHA_ENABLED=true sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache unavailable; continuing without RUSTC_WRAPPER"
          fi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-registry-

      - name: Install LLVM (for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
          cached: true

      - name: Build
        run: cargo build --release -p warp-opencode
        env:
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin

      - name: Test
        run: cargo test -p warp-opencode --all
        env:
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\warp-opencode-windows-x64
          Copy-Item target\release\warp-opencode.exe `
            dist\warp-opencode-windows-x64\warp-opencode.exe
          Compress-Archive `
            -Path dist\warp-opencode-windows-x64 `
            -DestinationPath dist\warp-opencode-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-opencode-windows-x64
          path: dist/warp-opencode-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build · macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Enable sccache if available
        run: |
          if SCCACHE_GHA_ENABLED=true sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache unavailable; continuing without RUSTC_WRAPPER"
          fi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-registry-

      - name: Build
        run: cargo build --release -p warp-opencode

      - name: Test
        run: cargo test -p warp-opencode --all

      - name: Package
        run: |
          mkdir -p dist/warp-opencode-macos-arm64
          cp target/release/warp-opencode dist/warp-opencode-macos-arm64/
          cd dist && zip -r warp-opencode-macos-arm64.zip warp-opencode-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-opencode-macos-arm64
          path: dist/warp-opencode-macos-arm64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
