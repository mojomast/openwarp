[workspace]
members = ["crates/warp-opencode"]
exclude = ["Warp"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
warpui = { path = "Warp/crates/warpui", default-features = false }
warpui_core = { path = "Warp/crates/warpui_core", default-features = false }

anyhow = "1"
base64 = "0.22"
bytes = "1"
eventsource-client = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
