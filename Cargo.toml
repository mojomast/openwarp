[workspace]
members = ["crates/warp-opencode"]
exclude = ["Warp"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
warpui = { git = "https://github.com/warpdotdev/warp", rev = "c325d146ab314971e1577f168cf45f03118c3ac5", default-features = false }
warpui_core = { git = "https://github.com/warpdotdev/warp", rev = "c325d146ab314971e1577f168cf45f03118c3ac5", default-features = false }
markdown_parser = { git = "https://github.com/warpdotdev/warp", rev = "c325d146ab314971e1577f168cf45f03118c3ac5" }
sum_tree = { git = "https://github.com/warpdotdev/warp", rev = "c325d146ab314971e1577f168cf45f03118c3ac5" }
warp_util = { git = "https://github.com/warpdotdev/warp", rev = "c325d146ab314971e1577f168cf45f03118c3ac5" }
pathfinder_geometry = "0.5.1"

anyhow = "1"
base64 = "0.22"
bytes = "1"
eventsource-client = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
vte = "0.13"
